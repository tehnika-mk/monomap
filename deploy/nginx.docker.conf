# MonoMap — nginx config for the container image.
#
# Serves the static SvelteKit export from /usr/share/nginx/html. Prerendered
# routes are flat files (/features -> features.html, /monomap-vs-miro ->
# monomap-vs-miro.html), so `$uri.html` must be tried before the SPA shell.
#
# No CSP is set here: a static build cannot know the Supabase host it was
# pointed at, and `connect-src 'self'` would break optional cloud sync.

server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	server_tokens off;

	# ---- Compression ----
	gzip on;
	gzip_vary on;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_proxied any;
	gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

	# ---- Security headers ----
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

	# ---- SPA fallback ----
	location / {
		try_files $uri $uri.html $uri/ /200.html;
	}

	# ---- Hashed, immutable build assets ----
	location /_app/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# ---- Other static assets ----
	location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp|xml|txt|json|webmanifest)$ {
		expires 7d;
		add_header Cache-Control "public";
		try_files $uri =404;
	}
}
